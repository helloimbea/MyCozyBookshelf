spring.application.name=backend
server.port=8080

# Database (override with the DB_URL, DB_USERNAME and DB_PASSWORD environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mycozybookshelf?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema managed by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
